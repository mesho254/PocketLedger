server.port=${SERVER_PORT:8080}
spring.application.name=pocketledger-service
spring.profiles.default=dev

# Local PostgreSQL Configuration (pgAdmin: pocketledger_db)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pocketledger_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
logging.level.org.springframework.security=INFO

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Jackson configuration for BigDecimal
spring.jackson.serialization.write-bigdecimal-as-plain=true
spring.jackson.deserialization.use-big-decimal-for-floats=true
spring.jackson.default-property-inclusion=non_null

# Error response configuration
server.error.include-message=always
server.error.include-binding-errors=always

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Springdoc OpenAPI / Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# File-Based Logging Configuration
logging.level.root=INFO
logging.level.com.pocketledger=DEBUG
logging.file.name=logs/app.log
logging.file.max-size=10MB
logging.file.max-history=10

